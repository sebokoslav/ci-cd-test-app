name: Release (publish stable & deploy prod)
on:
  push:
    # The vX.Y.Z tag push (minted by create-tag.yml) IS the release act
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    -
      name: Resolve Version
      id: version
      # The tag name IS the release version (v1.1.0 -> 1.1.0)
      run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    -
      name: Docker meta
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          sebokoslav/ci-cd-test-app
        tags: |
          type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
          # 'latest' only on stable releases, not v1.2.0-rc.1 style tags
          type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    -
      name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    -
      name: Build and push
      uses: docker/build-push-action@v3
      with:
        context: src/CiCdTestApp/
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: publish
    # Stable releases only: pre-release tags (e.g. v1.2.0-rc.1) stop here.
    # The 'prod' environment holds the required reviewers (manual approval).
    if: ${{ !contains(needs.publish.outputs.version, '-') }}
    environment: prod
    permissions:
      contents: read
      pull-requests: write
    steps:
    -
      name: Checkout Config Repo
      uses: actions/checkout@v3
      with:
        repository: sebokoslav/ci-cd-test-app-config
        token: ${{ secrets.CONFIG_REPO_PAT }}
        path: config-repo
        ref: prod

    -
      name: Update Version in values.yaml
      working-directory: config-repo
      run: |
        VERSION="${{ needs.publish.outputs.version }}"
        sed -i "s|image: \"sebokoslav/ci-cd-test-app:.*\"|image: \"sebokoslav/ci-cd-test-app:${VERSION}\"|g" ci-cd-test/values.yaml
        cat ci-cd-test/values.yaml | head -10

    -
      name: Commit and Push Changes
      working-directory: config-repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add ci-cd-test/values.yaml
        git diff --staged --quiet || git commit -m "chore: update image tag to ${{ needs.publish.outputs.version }}"
        git push origin prod
